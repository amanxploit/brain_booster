name: brain_booster
description: "A brain training app for fast mental calculations with dashboard tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  fl_chart: ^0.66.2
  intl: ^0.19.0
  uuid: ^4.3.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.jpeg"
  windows:
    generate: true
    image_path: "assets/images/logo.jpeg"
  macos:
    generate: true
    image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/logo.jpeg